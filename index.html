<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отметка местоположения</title>
<style>
  :root { --bg:#f4f6fa; --card:#fff; --ink:#1d2433; --muted:#6b7385; --line:#dfe3ec; --accent:#2f5bd8; --ok:#1e8e4e; --out:#c2571a; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  label:first-child { margin-top:0; }
  select, input, textarea { width:100%; padding:11px 12px; font:inherit; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:14px; cursor:pointer; color:#fff; width:100%; }
  button:disabled { opacity:.5; }
  .in { background:var(--ok); } .outb { background:var(--out); } .sec { background:var(--accent); }
  .status { font-size:14px; margin-top:12px; padding:10px 12px; border-radius:10px; display:none; }
  .status.ok { display:block; background:#e6f4ea; color:#14532d; }
  .status.err { display:block; background:#fdecea; color:#8a1c12; }
  .list div { display:flex; justify-content:space-between; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; }
  .list div:last-child { border-bottom:0; }
  .muted { color:var(--muted); font-size:14px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg input { display:none; }
  .seg label { flex:1; margin:0; padding:11px 8px; text-align:center; font-size:15px; color:var(--ink); cursor:pointer; background:#fff; }
  .seg input:checked + label { background:var(--accent); color:#fff; font-weight:600; }
  details summary { cursor:pointer; font-weight:600; }
  .link { background:none; color:var(--accent); width:auto; padding:0; font-weight:500; font-size:14px; }
</style>
</head>
<body>
<main>
  <h1>Отметка местоположения</h1>

  <div class="card" id="pinCard" style="display:none">
    <label for="pin">PIN</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN от руководителя">
    <div style="height:10px"></div>
    <button class="sec" id="pinBtn">Войти</button>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <label for="emp">Сотрудник</label>
      <select id="emp"></select>

      <label>Формат работы</label>
      <div class="seg">
        <input type="radio" name="fmt" id="fmtOn" value="Очно" checked><label for="fmtOn">Очно</label>
        <input type="radio" name="fmt" id="fmtOff" value="Дистанционно"><label for="fmtOff">Дистанционно</label>
      </div>

      <label for="place" id="placeLbl">Место / объект</label>
      <input id="place" list="places" placeholder="Выберите или впишите" autocomplete="off">
      <datalist id="places"></datalist>

      <label for="note">Цель / комментарий (необязательно)</label>
      <input id="note" placeholder="Например: плановая проверка">

      <div class="row" style="margin-top:16px">
        <button class="in" id="arriveBtn">Прибыл(а)</button>
        <button class="outb" id="departBtn">Убыл(а)</button>
      </div>
      <div class="status" id="status"></div>
    </div>

    <div class="card">
      <details>
        <summary>Отметить задним числом</summary>
        <label for="bDate">Дата</label>
        <input id="bDate" type="date">
        <div class="row">
          <div><label for="bIn">Прибытие</label><input id="bIn" type="time"></div>
          <div><label for="bOut">Выбытие</label><input id="bOut" type="time"></div>
        </div>
        <div style="height:12px"></div>
        <button class="sec" id="visitBtn">Записать визит</button>
        <p class="muted">Сотрудник, формат, место и комментарий берутся из полей выше.</p>
      </details>
    </div>

    <div class="card">
      <b>Сейчас в работе</b>
      <div class="list" id="onsite"></div>
      <div style="margin-top:8px"><button class="link" id="refresh">Обновить</button></div>
    </div>

  </div>
</main>

<script>
// ВСТАВЬТЕ сюда адрес веб-приложения Apps Script (заканчивается на /exec)
const API = 'https://script.google.com/macros/s/AKfycbzp-51TwuOQ9guV90uDErXS_d_nx3ofcDWjdFJoQnTFrWd-W-m8x2eX7v4CyPuyFWkuKg/exec';

const $ = id => document.getElementById(id);
let pin = localStorage.getItem('st_pin') || '';

function msg(text, ok) { const s = $('status'); s.textContent = text; s.className = 'status ' + (ok ? 'ok' : 'err'); }

async function call(payload) {
  const r = await fetch(API, { method: 'POST', body: JSON.stringify({ pin, ...payload }) }); // text/plain: без preflight
  return r.json();
}
async function load() {
  const r = await fetch(API + '?pin=' + encodeURIComponent(pin));
  return r.json();
}

function render(d) {
  const cur = $('emp').value || localStorage.getItem('st_emp') || '';
  $('emp').innerHTML = d.employees.map(n => `<option>${n}</option>`).join('');
  if (d.employees.includes(cur)) $('emp').value = cur;
  $('places').innerHTML = d.places.map(p => `<option value="${p.replace(/"/g, '&quot;')}">`).join('');
  $('onsite').innerHTML = d.onSite.length
    ? d.onSite.map(o => {
        const where = o.format === 'Дистанционно' ? (o.place ? 'дистант, проверяет: ' + o.place : 'дистант') : o.place;
        return `<div><span>${o.employee}</span><span class="muted" style="text-align:right">${where} · с ${o.since}</span></div>`;
      }).join('')
    : '<p class="muted">Сейчас никто не отмечен.</p>';
  if (!$('bDate').value) $('bDate').value = d.today;
}

async function start() {
  try {
    const r = await load();
    if (!r.ok) throw new Error(r.error);
    $('pinCard').style.display = 'none';
    $('app').style.display = 'block';
    localStorage.setItem('st_pin', pin);
    render(r.data);
  } catch (e) {
    localStorage.removeItem('st_pin');
    $('app').style.display = 'none';
    $('pinCard').style.display = 'block';
    if (pin) alert(e.message);
  }
}

async function act(payload, btn) {
  btn.disabled = true;
  try {
    localStorage.setItem('st_emp', $('emp').value);
    const r = await call(payload);
    if (!r.ok) throw new Error(r.error);
    msg('✓ ' + r.message, true);
    render(r.data);
  } catch (e) { msg(e.message, false); }
  btn.disabled = false;
}
const fmt = () => document.querySelector('input[name=fmt]:checked').value;
const base = () => ({ employee: $('emp').value, format: fmt(), place: $('place').value, note: $('note').value });
function syncFmt() {
  const remote = fmt() === 'Дистанционно';
  $('placeLbl').textContent = remote ? 'Проверяемое учреждение (если есть)' : 'Место / объект';
  $('place').placeholder = remote ? 'Оставьте пустым, если просто дистант' : 'Выберите или впишите';
  $('arriveBtn').textContent = remote ? 'Начал(а) работу' : 'Прибыл(а)';
  $('departBtn').textContent = remote ? 'Закончил(а)' : 'Убыл(а)';
}
document.querySelectorAll('input[name=fmt]').forEach(r => r.onchange = syncFmt);

$('pinBtn').onclick = () => { pin = $('pin').value.trim(); start(); };
$('arriveBtn').onclick = e => act({ action: 'arrive', ...base() }, e.target);
$('departBtn').onclick = e => act({ action: 'depart', ...base() }, e.target);
$('visitBtn').onclick = e => act({ action: 'visit', ...base(), date: $('bDate').value, arrive: $('bIn').value, depart: $('bOut').value }, e.target);

$('refresh').onclick = () => start();

if (pin) start(); else $('pinCard').style.display = 'block';
</script>
</body>
</html>
