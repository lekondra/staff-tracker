<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кто где</title>
<style>
  :root {
    --bg:#f3f5fb; --card:#fff; --ink:#1b2236; --muted:#6b7488; --line:#e3e7f1; --soft:#f6f8fd;
    --accent:#3557e0; --accent-soft:#e8edff;
    --ok:#1f9d57; --ok-soft:#e3f6ea;
    --rem:#2a74c9; --rem-soft:#e3f0fc;
    --gray:#7d8599; --gray-soft:#eceef4;
    --warn:#c9741a; --warn-soft:#fdf0e1;
    --leave:#8a5bc7; --leave-soft:#f0e9fb;
    --shadow:0 1px 2px rgba(20,30,60,.05), 0 6px 18px rgba(20,30,60,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1420; --card:#171d2c; --ink:#e8ecf6; --muted:#98a1b7; --line:#272f44; --soft:#1c2336;
      --accent:#7b95ff; --accent-soft:#222c52;
      --ok:#52d08a; --ok-soft:#173a29; --rem:#6db3ff; --rem-soft:#16304d;
      --gray:#9aa3b8; --gray-soft:#242b3d; --warn:#f0a85a; --warn-soft:#3a2a15;
      --leave:#c3a1f0; --leave-soft:#2c2142; --shadow:none;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.4 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif; background:var(--bg); color:var(--ink); }
  header { background:linear-gradient(135deg,#243b9c,#3557e0 60%,#4f7bff); color:#fff; padding:22px 16px 56px; }
  header .in { max-width:920px; margin:0 auto; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:24px; letter-spacing:-.2px; }
  header .sub { opacity:.85; font-size:14px; margin-top:2px; }
  main { max-width:920px; margin:-40px auto 40px; padding:0 14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
  label.f { display:block; font-size:12px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:0 0 5px; }
  input[type=date], input[type=password] { width:100%; padding:10px 12px; font:inherit; color:var(--ink); border:1px solid var(--line); border-radius:10px; background:var(--soft); }
  button { font:inherit; cursor:pointer; border:0; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > div { flex:1; min-width:140px; }
  .primary { background:var(--accent); color:#fff; font-weight:600; border-radius:10px; padding:11px 16px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .chip { background:var(--soft); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:14px; }
  .chip:hover { border-color:var(--accent); }
  .seg { display:inline-flex; background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:3px; }
  .seg button { background:none; color:var(--muted); padding:8px 14px; border-radius:9px; font-size:14px; font-weight:500; }
  .seg button.on { background:var(--card); color:var(--accent); box-shadow:0 1px 3px rgba(20,30,60,.12); font-weight:600; }
  .bar { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px; }
  details.emps > summary { cursor:pointer; font-size:14px; color:var(--accent); font-weight:600; list-style:none; }
  details.emps > summary::-webkit-details-marker { display:none; }
  .emps .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:2px 12px; margin-top:10px; }
  .emps .grid label { display:flex; gap:8px; align-items:center; font-size:15px; padding:5px 0; cursor:pointer; }
  .emps .tools { display:flex; gap:8px; margin-top:10px; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:14px; }
  .tile { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; box-shadow:var(--shadow); }
  .tile b { display:block; font-size:26px; line-height:1.1; }
  .tile span { font-size:13px; color:var(--muted); }
  .tile.min b { color:var(--accent); } .tile.inst b { color:var(--ok); } .tile.rem b { color:var(--rem); }
  .tile.leave b { color:var(--leave); } .tile.none b { color:var(--warn); }
  .period { font-size:14px; color:var(--muted); margin:2px 2px 10px; }

  details.group { background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden; }
  details.group > summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:14px 16px; }
  details.group > summary::-webkit-details-marker { display:none; }
  .gicon { width:38px; height:38px; border-radius:11px; display:flex; align-items:center; justify-content:center; font-size:18px; flex:none; }
  .g-min .gicon { background:var(--accent-soft); } .g-inst .gicon { background:var(--ok-soft); } .g-remote .gicon { background:var(--rem-soft); }
  .g-leave .gicon { background:var(--leave-soft); } .g-none .gicon { background:var(--warn-soft); }
  .gtitle { font-weight:650; flex:1; min-width:0; overflow-wrap:anywhere; }
  .gcount { font-size:13px; font-weight:650; background:var(--gray-soft); color:var(--ink); border-radius:999px; padding:3px 11px; }
  .gbody { border-top:1px solid var(--line); }
  .item { display:flex; gap:12px; padding:11px 16px; border-bottom:1px solid var(--line); align-items:flex-start; }
  .item:last-child { border-bottom:0; }
  .ava { width:36px; height:36px; border-radius:50%; background:var(--gray-soft); color:var(--ink); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex:none; }
  .ava.on { background:var(--ok-soft); color:var(--ok); } .ava.rem { background:var(--rem-soft); color:var(--rem); }
  .ava.plan { background:var(--accent-soft); color:var(--accent); } .ava.leave { background:var(--leave-soft); color:var(--leave); }
  .info { flex:1; min-width:0; }
  .nm { font-weight:600; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag { font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; white-space:nowrap; }
  .t-on { background:var(--ok-soft); color:var(--ok); } .t-rem { background:var(--rem-soft); color:var(--rem); }
  .t-off { background:var(--gray-soft); color:var(--gray); } .t-plan { background:var(--accent-soft); color:var(--accent); }
  .t-leave { background:var(--leave-soft); color:var(--leave); } .t-none { background:var(--warn-soft); color:var(--warn); }
  .sub2 { font-size:14px; color:var(--muted); margin-top:2px; }
  .mis { font-size:13px; color:var(--warn); margin-top:2px; }
  .date { font-size:13px; color:var(--muted); font-weight:500; }

  .person { border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:10px; background:var(--card); box-shadow:var(--shadow); }
  .person .head { display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
  .day { display:flex; gap:10px; padding:8px 0 0; margin-top:8px; border-top:1px dashed var(--line); }
  .day:first-of-type { border-top:0; margin-top:6px; }
  .day .dd { min-width:78px; color:var(--muted); font-size:14px; }
  .day .dc { flex:1; font-size:15px; }
  .planline { font-size:14px; color:var(--accent); background:var(--accent-soft); border-radius:8px; padding:3px 9px; display:inline-block; margin-bottom:3px; }
  .muted { color:var(--muted); font-size:14px; }
  .empty { text-align:center; color:var(--muted); padding:28px 10px; }
  #err { color:#d33; margin-top:8px; font-size:14px; }
</style>
</head>
<body>
<header>
  <div class="in">
    <div>
      <h1>Кто где</h1>
      <div class="sub">Управление финансового контроля и аудита</div>
    </div>
  </div>
</header>
<main>
  <div class="card" id="pinCard" style="display:none">
    <label class="f" for="pin">PIN руководителя</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <div style="height:10px"></div>
    <button class="primary" id="pinBtn">Войти</button>
    <div id="err"></div>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <div class="row">
        <div><label class="f" for="from">С даты</label><input id="from" type="date"></div>
        <div><label class="f" for="to">По дату</label><input id="to" type="date"></div>
      </div>
      <div class="chips">
        <button class="chip" id="qYest">Вчера</button>
        <button class="chip" id="qToday">Сегодня</button>
        <button class="chip" id="qTomorrow">Завтра</button>
        <button class="chip" id="qWeek">Последние 7 дней</button>
        <button class="chip" id="qAhead">Неделя вперёд</button>
        <button class="chip" id="qRefresh">↻ Обновить</button>
      </div>
      <div class="bar">
        <div class="seg" id="viewSeg">
          <button data-v="inst">По учреждениям</button>
          <button data-v="emp">По сотрудникам</button>
        </div>
        <details class="emps" id="empBox">
          <summary id="empSummary">Сотрудники</summary>
        </details>
      </div>
      <div class="emps" id="empPanel" style="display:none">
        <div class="tools">
          <button class="chip" id="allOn">Выбрать всех</button>
          <button class="chip" id="allOff">Снять выбор</button>
        </div>
        <div class="grid" id="emps"></div>
      </div>
    </div>

    <div class="period" id="period"></div>
    <div class="tiles" id="tiles"></div>
    <div id="result"></div>
  </div>
</main>

<script>
// Адрес веб-приложения Apps Script (тот же, что на странице сотрудников)
const API = 'https://script.google.com/macros/s/AKfycbzp-51TwuOQ9guV90uDErXS_d_nx3ofcDWjdFJoQnTFrWd-W-m8x2eX7v4CyPuyFWkuKg/exec';

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// --- разбор записи из графика ---
function parsePlan(t) {
  const lines = String(t || '').split('\n').map(s => s.trim()).filter(Boolean);
  let remote = false; const places = [], status = [];
  lines.forEach(l => {
    if (/дистант/i.test(l)) remote = true;
    const rest = l.replace(/дистант/ig, '').trim();
    if (!rest) return;
    if (/^(отпуск|больничный)/i.test(rest)) status.push(rest); else places.push(rest);
  });
  return { remote, places, status };
}
function planText(t) {
  const p = parsePlan(t);
  if (p.status.length) return p.status.join(', ') + (p.remote ? ' (дистант)' : '');
  if (p.places.length) return (p.remote ? 'дистант, проверяет: ' : '') + p.places.join(' + ');
  return p.remote ? 'дистант' : '—';
}
const dayLabel = ds => new Date(ds + 'T12:00:00').toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'numeric' });
const ru = s => s.split('-').reverse().join('.');
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const shortName = n => { const p = n.split(' '); return p.length >= 3 ? `${p[0]} ${p[1][0]}.${p[2][0]}.` : n; };
const initials = n => { const p = n.split(' '); return ((p[0] || '')[0] || '') + ((p[1] || '')[0] || ''); };
const nkey = p => String(p || '').toLowerCase().replace(/[^a-zа-яё0-9]/g, ''); // «ГБУСО МО «КЦСОР «X»» и «ГБУ СО МО КЦСОР X» — одно и то же
const isLeave = s => /^(отпуск|больничный)/i.test(String(s || '').trim());

let pin = localStorage.getItem('mg_pin') || '';
let data = null;
let selected = new Set(JSON.parse(localStorage.getItem('mg_sel') || 'null') || []);
let firstLoad = !localStorage.getItem('mg_sel');
let view = localStorage.getItem('mg_view') || 'inst';

async function fetchReport() {
  const q = new URLSearchParams({ action: 'report', pin, from: $('from').value, to: $('to').value });
  const r = await fetch(API + '?' + q);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}

async function load() {
  try {
    data = await fetchReport();
    localStorage.setItem('mg_pin', pin);
    $('pinCard').style.display = 'none';
    $('app').style.display = 'block';
    if (!$('from').value) { $('from').value = data.from; $('to').value = data.to; }
    if (firstLoad) { selected = new Set(data.employees); firstLoad = false; saveSel(); }
    renderEmps();
    render();
  } catch (e) {
    $('app').style.display = 'none';
    $('pinCard').style.display = 'block';
    $('err').textContent = pin ? e.message : '';
    localStorage.removeItem('mg_pin');
  }
}

function saveSel() { localStorage.setItem('mg_sel', JSON.stringify([...selected])); }

function renderEmps() {
  $('emps').innerHTML = data.employees.map(n =>
    `<label><input type="checkbox" value="${esc(n)}" ${selected.has(n) ? 'checked' : ''}> ${esc(n)}</label>`).join('');
  $('emps').querySelectorAll('input').forEach(cb => cb.onchange = () => {
    cb.checked ? selected.add(cb.value) : selected.delete(cb.value);
    saveSel(); render();
  });
}

function datesBetween(a, b) {
  const out = []; const d = new Date(a + 'T12:00:00'); const end = new Date(b + 'T12:00:00');
  for (let i = 0; i < 400 && d <= end; i++) { out.push(iso(d)); d.setDate(d.getDate() + 1); }
  return out;
}

/* ------------------------- группировка по учреждениям ------------------------- */
function buildItems(emps) {
  const dates = datesBetween(data.from, data.to);
  const single = dates.length === 1;
  const factsBy = {};
  data.rows.forEach(r => { (factsBy[r.employee + '|' + r.date] = factsBy[r.employee + '|' + r.date] || []).push(r); });
  const items = [], noData = [];
  emps.forEach(n => {
    dates.forEach(d => {
      const facts = (factsBy[n + '|' + d] || []).sort((a, b) => a.in.localeCompare(b.in));
      const planTxt = ((data.plan || {})[n] || {})[d];
      const pp = planTxt ? parsePlan(planTxt) : null;
      if (facts.length) {
        facts.forEach(f => {
          const remote = f.format === 'Дистанционно';
          const planKeys = pp ? pp.places.map(nkey) : [];
          const mismatch = pp && !pp.status.length && f.place && planKeys.length && !planKeys.includes(nkey(f.place));
          items.push({ emp: n, date: d, src: 'fact', place: f.place, status: isLeave(f.place) ? f.place : '', remote,
            in: f.in, out: f.out, dur: f.dur, note: f.note, today: d === data.today,
            planNote: mismatch ? planText(planTxt) : '' });
        });
      } else if (pp) {
        if (pp.status.length) items.push({ emp: n, date: d, src: 'plan', status: pp.status.join(', '), remote: pp.remote });
        else if (pp.places.length) pp.places.forEach(p => items.push({ emp: n, date: d, src: 'plan', place: p, remote: pp.remote }));
        else if (pp.remote) items.push({ emp: n, date: d, src: 'plan', place: '', remote: true });
      } else if (single) {
        noData.push(n);
      }
    });
  });
  return { items, noData };
}

function groupItems(items) {
  const map = new Map();
  const add = (key, kind, title, it) => {
    if (!map.has(key)) map.set(key, { key, kind, titles: new Map(), items: [] });
    const g = map.get(key);
    g.titles.set(title, (g.titles.get(title) || 0) + 1);
    g.items.push(it);
  };
  items.forEach(it => {
    if (it.status) return add('__leave', 'leave', 'Отпуск / больничный', it);
    if (!it.place) return add('__remote', 'remote', 'Дистант (без учреждения)', it);
    const k = nkey(it.place);
    if (k.startsWith('министерство')) return add('__min', 'min', 'Министерство', it);
    add(k, 'inst', it.place.trim().replace(/\s+/g, ' '), it);
  });
  const arr = [...map.values()].map(g => {
    g.title = g.kind === 'inst' ? [...g.titles.entries()].sort((a, b) => b[1] - a[1])[0][0] : [...g.titles.keys()][0];
    g.people = new Set(g.items.map(i => i.emp)).size;
    return g;
  });
  const order = { min: 0, inst: 1, remote: 2, leave: 3 };
  return arr.sort((a, b) => order[a.kind] - order[b.kind] || a.title.localeCompare(b.title, 'ru'));
}

function itemHtml(it, multiDay) {
  let ava = 'plan', tag = '<span class="tag t-plan">по графику</span>', sub = '';
  if (it.status) { ava = 'leave'; tag = '<span class="tag t-leave">' + esc(it.status) + '</span>'; }
  else if (it.src === 'fact') {
    if (!it.out && it.today) { ava = it.remote ? 'rem' : 'on'; tag = it.remote ? '<span class="tag t-rem">дистант</span>' : '<span class="tag t-on">на объекте</span>'; }
    else { ava = ''; tag = '<span class="tag t-off">' + (it.out ? (it.remote ? 'закончил(а) ' : 'убыл(а) ') + esc(it.out) : 'без выбытия') + '</span>'; if (it.remote) tag += ' <span class="tag t-rem">дистант</span>'; }
    sub = `${esc(it.in || '—')} – ${esc(it.out || '…')}${it.dur ? ' (' + esc(it.dur) + ')' : ''}`;
    if (it.note) sub += ' · ' + esc(it.note);
  } else if (it.remote) {
    tag += ' <span class="tag t-rem">дистант</span>';
  }
  const mis = it.planNote ? `<div class="mis">⚠ по графику было: ${esc(it.planNote)}</div>` : '';
  return `<div class="item"><div class="ava ${ava}">${esc(initials(it.emp))}</div><div class="info">
    <div class="nm">${esc(shortName(it.emp))} ${multiDay ? `<span class="date">${dayLabel(it.date)}</span>` : ''} ${tag}</div>
    ${sub ? `<div class="sub2">${sub}</div>` : ''}${mis}</div></div>`;
}

const ICON = { min: '🏛️', inst: '🏢', remote: '💻', leave: '🌴', none: '❔' };

function renderInst(emps) {
  const { items, noData } = buildItems(emps);
  const groups = groupItems(items);
  const multiDay = data.from !== data.to;
  const cnt = k => groups.filter(g => g.kind === k).reduce((s, g) => s + new Set(g.items.map(i => i.emp)).size, 0);
  $('tiles').innerHTML =
    `<div class="tile min"><b>${cnt('min')}</b><span>в министерстве</span></div>` +
    `<div class="tile inst"><b>${cnt('inst')}</b><span>в учреждениях</span></div>` +
    `<div class="tile rem"><b>${cnt('remote')}</b><span>дистант без учреждения</span></div>` +
    `<div class="tile leave"><b>${cnt('leave')}</b><span>отпуск / больничный</span></div>` +
    (multiDay ? '' : `<div class="tile none"><b>${noData.length}</b><span>нет данных</span></div>`);

  let html = groups.map(g => `
    <details class="group g-${g.kind}" open>
      <summary><div class="gicon">${ICON[g.kind]}</div><div class="gtitle">${esc(g.title)}</div><div class="gcount">${g.people}</div></summary>
      <div class="gbody">${g.items
        .sort((a, b) => (a.date + (a.in || '')).localeCompare(b.date + (b.in || '')) || a.emp.localeCompare(b.emp, 'ru'))
        .map(i => itemHtml(i, multiDay)).join('')}</div>
    </details>`).join('');

  if (noData.length) html += `
    <details class="group g-none" open>
      <summary><div class="gicon">${ICON.none}</div><div class="gtitle">Нет данных (ни отметки, ни графика)</div><div class="gcount">${noData.length}</div></summary>
      <div class="gbody">${noData.map(n => `<div class="item"><div class="ava">${esc(initials(n))}</div><div class="info"><div class="nm">${esc(shortName(n))} <span class="tag t-none">нет данных</span></div></div></div>`).join('')}</div>
    </details>`;
  $('result').innerHTML = html || '<div class="card empty">Нет данных за выбранный период.</div>';
}

/* ------------------------- вид «по сотрудникам» ------------------------- */
function where(e) {
  if (e.format === 'Дистанционно') return e.place ? 'дистант, проверяет: ' + esc(e.place) : 'дистант';
  return esc(e.place || '—');
}
function badge(last) {
  if (!last) return '<span class="tag t-none">нет отметок</span>';
  const remote = last.format === 'Дистанционно';
  if (!last.out && last.date === data.today) return remote ? '<span class="tag t-rem">дистант</span>' : '<span class="tag t-on">на объекте</span>';
  return '<span class="tag t-off">' + (remote ? 'закончил(а)' : 'убыл(а)') + '</span>';
}
function renderEmp(emps) {
  const multiDay = data.from !== data.to;
  let nOn = 0, nRem = 0, nNone = 0;
  const html = emps.map(n => {
    const list = data.rows.filter(r => r.employee === n).sort((a, b) => (a.date + a.in).localeCompare(b.date + b.in));
    const plan = (data.plan || {})[n] || {};
    const last = list[list.length - 1];
    const open = last && !last.out && last.date === data.today;
    if (!last) nNone++; else if (open) (last.format === 'Дистанционно' ? nRem++ : nOn++);
    const dates = [...new Set([...list.map(e => e.date), ...Object.keys(plan)])].sort();
    const days = dates.map(d => {
      const facts = list.filter(e => e.date === d);
      const planHtml = plan[d] ? `<div class="planline">по графику: ${esc(planText(plan[d]))}</div>` : '';
      const factHtml = facts.length ? facts.map(e => `
        <div style="padding-top:2px">${esc(e.in)} – ${esc(e.out || '…')}${e.dur ? ' (' + esc(e.dur) + ')' : ''} · ${where(e)}${e.note ? ' <span class="muted">· ' + esc(e.note) + '</span>' : ''}</div>`).join('')
        : (d <= data.today ? '<div class="muted">отметок нет</div>' : '');
      return `<div class="day"><span class="dd">${multiDay || dates.length > 1 ? dayLabel(d) : ''}</span><div class="dc">${planHtml}${factHtml}</div></div>`;
    }).join('') || '<div class="muted" style="padding-top:6px">За выбранный период данных нет</div>';
    return `<div class="person"><div class="head"><b>${esc(n)}</b>${badge(last)}</div>${days}</div>`;
  }).join('');
  $('tiles').innerHTML =
    `<div class="tile inst"><b>${nOn}</b><span>на объекте сейчас</span></div>` +
    `<div class="tile rem"><b>${nRem}</b><span>дистант сейчас</span></div>` +
    `<div class="tile none"><b>${nNone}</b><span>без отметок</span></div>`;
  $('result').innerHTML = html || '<div class="card empty">Выберите сотрудников.</div>';
}

function render() {
  const emps = data.employees.filter(n => selected.has(n));
  $('empSummary').textContent = `Сотрудники: ${emps.length} из ${data.employees.length} ▾`;
  $('period').textContent = ru(data.from) + (data.from !== data.to ? ' – ' + ru(data.to) : '') +
    (data.planFound ? '' : ' · график не найден в таблице');
  document.querySelectorAll('#viewSeg button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  view === 'inst' ? renderInst(emps) : renderEmp(emps);
}

function setRange(a, b) { $('from').value = iso(a); $('to').value = iso(b); load(); }
const shift = n => { const d = new Date(); d.setDate(d.getDate() + n); return d; };
$('pinBtn').onclick = () => { pin = $('pin').value.trim(); load(); };
$('qToday').onclick = () => setRange(shift(0), shift(0));
$('qYest').onclick = () => setRange(shift(-1), shift(-1));
$('qTomorrow').onclick = () => setRange(shift(1), shift(1));
$('qWeek').onclick = () => setRange(shift(-6), shift(0));
$('qAhead').onclick = () => setRange(shift(0), shift(6));
$('qRefresh').onclick = () => load();
$('from').onchange = $('to').onchange = () => load();
$('allOn').onclick = () => { selected = new Set(data.employees); saveSel(); renderEmps(); render(); };
$('allOff').onclick = () => { selected.clear(); saveSel(); renderEmps(); render(); };
$('empBox').querySelector('summary').onclick = e => { e.preventDefault(); const p = $('empPanel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; };
document.querySelectorAll('#viewSeg button').forEach(b => b.onclick = () => { view = b.dataset.v; localStorage.setItem('mg_view', view); render(); });

if (pin) load(); else $('pinCard').style.display = 'block';
</script>
</body>
</html>
